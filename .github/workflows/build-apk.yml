name: Compila App Test

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dai i permessi a Gradle
      run: chmod +x examples/text_summarizer/android/gradlew

    - name: Compila l'APK
      run: |
        cd examples/text_summarizer/android
        ./gradlew assembleDebug

    - name: Salva l'APK da scaricare
      uses: actions/upload-artifact@v4
      with:
        name: Test-App
        path: examples/text_summarizer/android/app/build/outputs/apk/debug/app-debug.apk
        
