name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "1.9.22" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 29
                targetSdk = 34
                versionCode = 3
                versionName = "2.1"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            implementation("com.google.ai.edge.aicore:aicore:0.0.1-exp02")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <application android:label="Gemini Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.os.Bundle
        import android.widget.TextView
        import android.widget.ScrollView
        import kotlinx.coroutines.*
        import com.google.ai.edge.aicore.AiCoreClient
        
        class MainActivity : Activity() {
            private val scope = CoroutineScope(Dispatchers.Main + Job())
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                val textView = TextView(this).apply { 
                    text = "--- Agente Gemini Nano Inizializzato ---\n"
                    textSize = 16f
                    setPadding(32, 32, 32, 32) 
                }
                setContentView(ScrollView(this).apply { addView(textView) })
                
                scope.launch {
                    try {
                        textView.append("\nRichiesta accesso alla TPU tramite Android AICore...\n")
                        
                        val aiCoreClient = AiCoreClient.create(applicationContext)
                        val model = aiCoreClient.getGenerativeModel("gemini-nano")
                        
                        textView.append("✅ Modello Gemini Nano agganciato!\n\nGenerazione comando in corso...\n")
                        
                        val prompt = "Sei un agente terminale. Qual è il comando Linux per vedere in quale cartella mi trovo? Rispondi solo ed esclusivamente con il comando, senza spiegazioni."
                        
                        val response = withContext(Dispatchers.IO) {
                            model.generateContent(prompt)
                        }
                        
                        textView.append("\n🤖 Comando generato: ${response.text}\n\n[Pronto per invio a Termux]")
                    } catch (e: Exception) { 
                        textView.append("\nErrore di sistema: ${e.message}\n\nVerifica che AICore sia attivo sul dispositivo.")
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                scope.cancel()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-GeminiNano-TPU
        path: app/build/outputs/apk/debug/app-debug.apk
        
