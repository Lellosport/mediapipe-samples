name: Compila Agente Gemini Nano Client

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 38
                versionName = "16.0-Termux-Bridge"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            // Addio MediaPipe! Ora l'app è leggerissima.
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        # MANIFEST: Aggiunti permessi INTERNET e usesCleartextTraffic per parlare con localhost
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
                <package android:name="com.termux" />
            </queries>
            
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application 
                android:label="Gemini Agent Bridge" 
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:usesCleartextTraffic="true">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # FILE 1: Il Cervello (Ora si connette al Server Llama.cpp)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/GeminiAgentBrain.kt
        package com.agente.gemma
        
        import android.app.PendingIntent
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import kotlinx.coroutines.*
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        
        class GeminiAgentBrain(private val context: Context, private val logger: (String) -> Unit, private val onFinish: () -> Unit) {
            private val scope = CoroutineScope(Dispatchers.IO + Job())
            private var conversationHistory = ""
            private var stepCount = 0
            
            private val systemPrompt = """
                Sei un Ingegnere Software Autonomo.
                USA I DELIMITATORI. Non scrivere fuori dai tag.
                #INIZIO COMANDO#
                comando_qui
                #FINE COMANDO#
                
                #INIZIO FINE#
                completato
                #FINE FINE#
            """.trimIndent() + "\n\n"

            fun startTask(objective: String, temp: Float, topK: Int, maxTokens: Int) {
                stepCount = 0
                conversationHistory = systemPrompt + "Obiettivo: $objective\n"
                logger("🎯 Avvio task (Connessione a Termux)...\n")
                thinkAndAct(temp, topK, maxTokens)
            }

            fun processTermuxResult(exitCode: Int, out: String, err: String, temp: Float, topK: Int, maxTokens: Int) {
                stepCount++
                if (stepCount >= 7) {
                    logger("🛑 Limite azioni raggiunto.\n\n")
                    onFinish()
                    return
                }
                
                val safeOut = if (out.length > 150) out.take(150) + "..." else out
                val safeErr = if (err.length > 150) err.take(150) + "..." else err
                
                val historyLines = conversationHistory.lines()
                if (historyLines.size > 20) {
                    conversationHistory = systemPrompt + historyLines.takeLast(8).joinToString("\n") + "\n"
                }
                
                conversationHistory += "Exit: $exitCode, Out: $safeOut, Err: $safeErr\nProssima mossa?\n"
                thinkAndAct(temp, topK, maxTokens)
            }

            private fun thinkAndAct(temp: Float, topK: Int, maxTokens: Int) {
                scope.launch {
                    try {
                        val url = URL("http://127.0.0.1:8080/completion")
                        val conn = url.openConnection() as HttpURLConnection
                        conn.requestMethod = "POST"
                        conn.setRequestProperty("Content-Type", "application/json; utf-8")
                        conn.doOutput = true
                        
                        val jsonInput = JSONObject().apply {
                            put("prompt", conversationHistory)
                            put("temperature", temp)
                            put("top_k", topK)
                            put("n_predict", maxTokens)
                        }.toString()

                        conn.outputStream.use { os ->
                            val input = jsonInput.toByteArray(Charsets.UTF_8)
                            os.write(input, 0, input.size)
                        }

                        val responseCode = conn.responseCode
                        if (responseCode == 200) {
                            val responseBody = conn.inputStream.bufferedReader().use { it.readText() }
                            val jsonResponse = JSONObject(responseBody)
                            val aiRawText = jsonResponse.optString("content", "").trim()
                            
                            var cmdToRun = ""
                            var finishMsg = ""
                            
                            if (aiRawText.contains("#INIZIO COMANDO#") && aiRawText.contains("#FINE COMANDO#")) {
                                cmdToRun = aiRawText.substringAfter("#INIZIO COMANDO#").substringBefore("#FINE COMANDO#").trim()
                            } else if (aiRawText.contains("#INIZIO FINE#") && aiRawText.contains("#FINE FINE#")) {
                                finishMsg = aiRawText.substringAfter("#INIZIO FINE#").substringBefore("#FINE FINE#").trim()
                            }
                            
                            withContext(Dispatchers.Main) {
                                if (cmdToRun.isNotBlank()) {
                                    logger("🤖 Eseguo:\n$cmdToRun\n")
                                    conversationHistory += "Hai inviato un comando.\n"
                                    sendToTermux(cmdToRun)
                                } else if (finishMsg.isNotBlank()) {
                                    logger("✅ Finito: $finishMsg\n\n")
                                    onFinish()
                                } else {
                                    logger("⚠️ Errore sintassi IA...\n")
                                    conversationHistory += "ERRORE: Usa i tag.\n"
                                    thinkAndAct(temp, topK, maxTokens)
                                }
                            }
                        } else {
                            withContext(Dispatchers.Main) {
                                logger("❌ Errore Server Termux: Codice $responseCode\nIl server è acceso?\n")
                                onFinish()
                            }
                        }
                    } catch (e: Exception) {
                        withContext(Dispatchers.Main) {
                            logger("❌ Errore Connessione: ${e.message}\nHai avviato il server su Termux?\n")
                            onFinish()
                        }
                    }
                }
            }

            private fun sendToTermux(cmd: String) {
                val resultIntent = Intent("com.agente.gemma.RESULT")
                resultIntent.setPackage(context.packageName)
                val pendingIntent = PendingIntent.getBroadcast(context, 0, resultIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE)
                
                val intent = Intent("com.termux.RUN_COMMAND")
                intent.setClassName("com.termux", "com.termux.app.RunCommandService")
                intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/usr/bin/sh")
                intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS", arrayOf("-c", cmd))
                intent.putExtra("com.termux.RUN_COMMAND_WORKDIR", "/data/data/com.termux/files/home")
                intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true)
                intent.putExtra("com.termux.RUN_COMMAND_PENDING_INTENT", pendingIntent)
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    context.startForegroundService(intent)
                } else {
                    context.startService(intent)
                }
            }
        }
        EOF
        
        # FILE 2: La UI (Pulita e ottimizzata)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.SeekBar
        import android.widget.TextView
        
        class MainActivity : Activity() {
            private lateinit var logView: TextView
            private lateinit var submitButton: Button
            private lateinit var agentBrain: GeminiAgentBrain
            
            private var fileContent: String = ""
            
            // Valori
            private var valTemp = 0.7f
            private var valTopK = 40
            private var valTokens = 2048
            
            private val PICK_TXT_FILE = 1001
            
            private val termuxReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context, intent: Intent) {
                    val bundle = intent.extras ?: return
                    val exitCode = bundle.getInt("com.termux.RUN_COMMAND_EXIT_CODE")
                    val out = bundle.getString("com.termux.RUN_COMMAND_STDOUT")?.trim() ?: ""
                    val err = bundle.getString("com.termux.RUN_COMMAND_STDERR")?.trim() ?: ""
                    agentBrain.processTermuxResult(exitCode, out, err, valTemp, valTopK, valTokens)
                }
            }
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                
                agentBrain = GeminiAgentBrain(
                    context = this,
                    logger = { msg -> logView.append(msg) },
                    onFinish = { submitButton.isEnabled = true }
                )
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    registerReceiver(termuxReceiver, IntentFilter("com.agente.gemma.RESULT"), Context.RECEIVER_EXPORTED)
                } else {
                    registerReceiver(termuxReceiver, IntentFilter("com.agente.gemma.RESULT"))
                }
                
                if (checkSelfPermission("com.termux.permission.RUN_COMMAND") != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf("com.termux.permission.RUN_COMMAND"), 1)
                }
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(30, 30, 30, 30)
                }
                
                val lblTitle = TextView(this).apply { text = "Gemini Agent Bridge\n"; textSize = 18f; setTypeface(null, android.graphics.Typeface.BOLD) }
                
                // SLIDERS
                val lblTemp = TextView(this).apply { text = "Temperatura: $valTemp" }
                val sbTemp = SeekBar(this).apply { max = 100; progress = 70; setOnSeekBarChangeListener(object: SeekBar.OnSeekBarChangeListener{ override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { valTemp = p/100f; lblTemp.text = "Temperatura: $valTemp" }; override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}}) }
                
                val lblTopK = TextView(this).apply { text = "Top-K: $valTopK" }
                val sbTopK = SeekBar(this).apply { max = 99; progress = 39; setOnSeekBarChangeListener(object: SeekBar.OnSeekBarChangeListener{ override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { valTopK = p+1; lblTopK.text = "Top-K: $valTopK" }; override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}}) }
                
                val lblTokens = TextView(this).apply { text = "Max Tokens: $valTokens" }
                val sbTokens = SeekBar(this).apply { max = 3900; progress = 2048 - 128; setOnSeekBarChangeListener(object: SeekBar.OnSeekBarChangeListener{ override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) { valTokens = p+128; lblTokens.text = "Max Tokens: $valTokens" }; override fun onStartTrackingTouch(s: SeekBar?) {}; override fun onStopTrackingTouch(s: SeekBar?) {}}) }
                
                val btnPrompt = Button(this).apply {
                    text = "1. SELEZIONA PROMPT (.txt)"
                    setOnClickListener { startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply { type = "text/plain" }, PICK_TXT_FILE) }
                }
                
                submitButton = Button(this).apply {
                    text = "2. AVVIA AGENTE"
                    setOnClickListener {
                        if (fileContent.isBlank()) {
                            logView.append("⚠️ Carica un prompt prima!\n")
                            return@setOnClickListener
                        }
                        submitButton.isEnabled = false
                        agentBrain.startTask(fileContent, valTemp, valTopK, valTokens)
                    }
                }
                
                logView = TextView(this).apply { text = "--- Console ---\nAssicurati che il server Termux sia acceso in background.\n\n"; textSize = 14f }
                
                layout.addView(lblTitle)
                layout.addView(lblTemp); layout.addView(sbTemp)
                layout.addView(lblTopK); layout.addView(sbTopK)
                layout.addView(lblTokens); layout.addView(sbTokens)
                layout.addView(btnPrompt)
                layout.addView(submitButton)
                layout.addView(logView)
                
                setContentView(ScrollView(this).apply { addView(layout) })
            }
            
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (resultCode == RESULT_OK && data?.data != null && requestCode == PICK_TXT_FILE) {
                    try {
                        fileContent = contentResolver.openInputStream(data.data!!)?.bufferedReader()?.use { it.readText() } ?: ""
                        logView.append("✅ Prompt caricato!\n")
                    } catch (e: Exception) {
                        logView.append("❌ Errore lettura prompt\n")
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                unregisterReceiver(termuxReceiver)
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-Bridge-Termux
        path: app/build/outputs/apk/debug/app-debug.apk
        
