name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 32
                versionName = "13.1"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            implementation("com.google.mlkit:genai-prompt:1.0.0-beta2")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
                <package android:name="com.termux" />
            </queries>
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <application android:label="Gemini Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # FILE 1: Il Cervello (Configurazione fixata per la Beta di ML Kit)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/GeminiAgentBrain.kt
        package com.agente.gemma
        
        import android.app.PendingIntent
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import kotlinx.coroutines.*
        import com.google.mlkit.genai.prompt.Generation
        
        class GeminiAgentBrain(private val context: Context, private val logger: (String) -> Unit, private val onFinish: () -> Unit) {
            private val scope = CoroutineScope(Dispatchers.IO + Job())
            private var conversationHistory = ""
            private var stepCount = 0
            
            private val systemPrompt = """
                Sei un Ingegnere Software Autonomo di livello Senior.
                DEVI USARE OBBILGATORIAMENTE I DELIMITATORI. Non scrivere codice fuori da questi tag.
                
                REGOLE DI SVILUPPO (FONDAMENTALI):
                - NON essere pigro. Scrivi file lunghi, completi e ricchi di dettagli.
                - Se scrivi HTML, includi SEMPRE CSS in linea elaborato, animazioni, immagini e struttura professionale.
                - Non usare MAI placeholder come "inserisci testo qui". Fai tutto tu.
                
                Per agire su Linux:
                #INIZIO COMANDO#
                tuo_comando_qui
                #FINE COMANDO#
                
                Per concludere il lavoro:
                #INIZIO FINE#
                completato
                #FINE FINE#
                
                REGOLE MULTIMEDIALI:
                - Per spostare file usa mv o cp.
                - Per VISUALIZZARE un'immagine o RIPRODURRE un audio, usa: termux-open nomefile.ext
            """.trimIndent() + "\n\n"

            fun startTask(objective: String, temperature: Float) {
                stepCount = 0
                // La temperatura è ignorata in questa versione Beta locale, 
                // ma il prompt rigoroso imporrà comunque creatività.
                conversationHistory = systemPrompt + "Obiettivo: $objective\n"
                logger("🎯 Avvio task (Modalità IA Locale)...\n")
                thinkAndAct()
            }

            fun processTermuxResult(exitCode: Int, out: String, err: String) {
                stepCount++
                if (stepCount >= 7) {
                    logger("🛑 Limite azioni raggiunto. Forzo lo stop.\n\n")
                    onFinish()
                    return
                }
                
                val safeOut = if (out.length > 150) out.take(150) + "..." else out
                val safeErr = if (err.length > 150) err.take(150) + "..." else err
                
                val historyLines = conversationHistory.lines()
                if (historyLines.size > 20) {
                    conversationHistory = systemPrompt + historyLines.takeLast(8).joinToString("\n") + "\n"
                }
                
                conversationHistory += "Exit: $exitCode, Out: $safeOut, Err: $safeErr\nCosa fai ora?\n"
                thinkAndAct()
            }

            private fun thinkAndAct() {
                scope.launch {
                    try {
                        // Utilizziamo il client base supportato dalla Beta
                        val model = Generation.getClient()
                        val response = model.generateContent(conversationHistory)
                        val aiRawText = response.candidates.firstOrNull()?.text?.trim() ?: ""
                        
                        var cmdToRun = ""
                        var finishMsg = ""
                        
                        if (aiRawText.contains("#INIZIO COMANDO#") && aiRawText.contains("#FINE COMANDO#")) {
                            cmdToRun = aiRawText.substringAfter("#INIZIO COMANDO#").substringBefore("#FINE COMANDO#").trim()
                        } else if (aiRawText.contains("#INIZIO FINE#") && aiRawText.contains("#FINE FINE#")) {
                            finishMsg = aiRawText.substringAfter("#INIZIO FINE#").substringBefore("#FINE FINE#").trim()
                        }
                        
                        withContext(Dispatchers.Main) {
                            if (cmdToRun.isNotBlank()) {
                                logger("🤖 Eseguo:\n$cmdToRun\n")
                                conversationHistory += "Hai inviato un comando.\n"
                                sendToTermux(cmdToRun)
                            } else if (finishMsg.isNotBlank()) {
                                logger("✅ Finito: $finishMsg\n\n")
                                onFinish()
                            } else {
                                logger("⚠️ Errore sintassi IA, riallineamento in corso...\n")
                                conversationHistory += "ERRORE: Sintassi non trovata o vuota. Usa #INIZIO COMANDO# o #INIZIO FINE#.\n"
                                thinkAndAct()
                            }
                        }
                    } catch (e: Exception) {
                        withContext(Dispatchers.Main) {
                            logger("❌ Errore TPU: ${e.message}\n")
                            onFinish()
                        }
                    }
                }
            }

            private fun sendToTermux(cmd: String) {
                val resultIntent = Intent("com.agente.gemma.RESULT")
                resultIntent.setPackage(context.packageName)
                val pendingIntent = PendingIntent.getBroadcast(
                    context, 0, resultIntent, 
                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                )
                
                val intent = Intent("com.termux.RUN_COMMAND")
                intent.setClassName("com.termux", "com.termux.app.RunCommandService")
                intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/usr/bin/sh")
                intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS", arrayOf("-c", cmd))
                intent.putExtra("com.termux.RUN_COMMAND_WORKDIR", "/data/data/com.termux/files/home")
                intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true)
                intent.putExtra("com.termux.RUN_COMMAND_PENDING_INTENT", pendingIntent)
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    context.startForegroundService(intent)
                } else {
                    context.startService(intent)
                }
            }
        }
        EOF
        
        # FILE 2: La UI (Con file picker e slider mantenuti)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.SeekBar
        import android.widget.TextView
        
        class MainActivity : Activity() {
            private lateinit var logView: TextView
            private lateinit var submitButton: Button
            private lateinit var fileLabel: TextView
            private lateinit var agentBrain: GeminiAgentBrain
            
            private var fileContent: String = ""
            private var currentTemperature = 0.7f
            private val PICK_TXT_FILE = 1001
            
            private val termuxReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context, intent: Intent) {
                    val bundle = intent.extras ?: return
                    val exitCode = bundle.getInt("com.termux.RUN_COMMAND_EXIT_CODE")
                    val out = bundle.getString("com.termux.RUN_COMMAND_STDOUT")?.trim() ?: ""
                    val err = bundle.getString("com.termux.RUN_COMMAND_STDERR")?.trim() ?: ""
                    
                    logView.append("   [Exit Code: $exitCode]\n")
                    agentBrain.processTermuxResult(exitCode, out, err)
                }
            }
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                
                agentBrain = GeminiAgentBrain(
                    context = this,
                    logger = { msg -> logView.append(msg) },
                    onFinish = { submitButton.isEnabled = true }
                )
                
                val filter = IntentFilter("com.agente.gemma.RESULT")
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    registerReceiver(termuxReceiver, filter, Context.RECEIVER_EXPORTED)
                } else {
                    registerReceiver(termuxReceiver, filter)
                }
                
                if (checkSelfPermission("com.termux.permission.RUN_COMMAND") != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf("com.termux.permission.RUN_COMMAND"), 1)
                }
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(48, 48, 48, 48)
                }
                
                val tempLabel = TextView(this).apply {
                    text = "L'IA Cloud usa la Temperatura. L'IA Locale (Nano) è forzata alla massima precisione dal sistema."
                    setPadding(0, 0, 0, 10)
                }
                
                fileLabel = TextView(this).apply {
                    text = "Nessun file selezionato"
                    setPadding(0, 20, 0, 20)
                }
                
                val selectFileButton = Button(this).apply {
                    text = "Seleziona File .txt (Il tuo Prompt)"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "text/plain"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        startActivityForResult(intent, PICK_TXT_FILE)
                    }
                }
                
                logView = TextView(this).apply { 
                    text = "---\n\n"
                    textSize = 15f
                }
                
                submitButton = Button(this).apply {
                    text = "Avvia Agente"
                    setOnClickListener {
                        if (fileContent.isBlank()) {
                            logView.append("⚠️ Errore: Seleziona prima un file .txt!\n")
                            return@setOnClickListener
                        }
                        submitButton.isEnabled = false
                        logView.append("\n🎯 OBIETTIVO DAL FILE (${fileContent.length} char)\n")
                        agentBrain.startTask(fileContent, currentTemperature)
                    }
                }
                
                layout.addView(tempLabel)
                layout.addView(selectFileButton)
                layout.addView(fileLabel)
                layout.addView(submitButton)
                layout.addView(logView)
                
                setContentView(ScrollView(this).apply { addView(layout) })
            }
            
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == PICK_TXT_FILE && resultCode == RESULT_OK) {
                    data?.data?.let { uri ->
                        try {
                            val content = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                            if (!content.isNullOrBlank()) {
                                fileContent = content
                                fileLabel.text = "✅ File caricato con successo!"
                            } else {
                                fileLabel.text = "❌ Il file è vuoto"
                                fileContent = ""
                            }
                        } catch (e: Exception) {
                            fileLabel.text = "❌ Errore durante la lettura"
                            fileContent = ""
                        }
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                unregisterReceiver(termuxReceiver)
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-GeminiNano-Termux
        path: app/build/outputs/apk/debug/app-debug.apk
        
