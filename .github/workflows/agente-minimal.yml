name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 19
                versionName = "7.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            implementation("com.google.mlkit:genai-prompt:1.0.0-beta2")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            
            <!-- 1. Rendiamo Termux visibile alla nostra App -->
            <queries>
                <package android:name="com.termux" />
            </queries>
            
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            
            <application android:label="Gemini Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.os.Bundle
        import android.widget.Button
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.TextView
        import kotlinx.coroutines.*
        import com.google.mlkit.genai.prompt.Generation
        
        class MainActivity : Activity() {
            private val scope = CoroutineScope(Dispatchers.Main + Job())
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                // 2. Forza Android a farti accettare il permesso a schermo
                if (checkSelfPermission("com.termux.permission.RUN_COMMAND") != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf("com.termux.permission.RUN_COMMAND"), 1)
                }
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(48, 48, 48, 48)
                }
                
                val logView = TextView(this).apply { 
                    text = "--- Agente Gemini Nano Interattivo ---\nConnessione alla TPU pronta.\n\n"
                    textSize = 15f
                }
                
                val inputField = EditText(this).apply {
                    hint = "Es: crea un file chiamato prova.txt"
                    textSize = 16f
                }
                
                val submitButton = Button(this).apply {
                    text = "Genera ed Esegui"
                }
                
                layout.addView(inputField)
                layout.addView(submitButton)
                layout.addView(logView)
                
                setContentView(ScrollView(this).apply { addView(layout) })
                
                val model = Generation.getClient()
                
                submitButton.setOnClickListener {
                    val userRequest = inputField.text.toString()
                    if (userRequest.isBlank()) return@setOnClickListener
                    
                    submitButton.isEnabled = false
                    logView.append("⏳ Richiesta: $userRequest\n")
                    
                    scope.launch {
                        try {
                            val prompt = "Sei un agente terminale Linux. L'utente chiede: '$userRequest'. Rispondi SOLO con il comando bash corrispondente, senza markdown, senza virgolette e senza spiegazioni."
                            
                            val response = withContext(Dispatchers.IO) {
                                model.generateContent(prompt)
                            }
                            
                            val generatedCommand = response.candidates.firstOrNull()?.text?.trim()
                            
                            if (!generatedCommand.isNullOrEmpty()) {
                                logView.append("🤖 Comando: $generatedCommand\n")
                                
                                val intent = Intent("com.termux.RUN_COMMAND")
                                intent.setClassName("com.termux", "com.termux.app.RunCommandService")
                                intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/usr/bin/sh")
                                intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS", arrayOf("-c", generatedCommand))
                                intent.putExtra("com.termux.RUN_COMMAND_WORKDIR", "/data/data/com.termux/files/home")
                                intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", false)
                                startService(intent)
                                
                                val termuxLaunchIntent = packageManager.getLaunchIntentForPackage("com.termux")
                                if (termuxLaunchIntent != null) {
                                    startActivity(termuxLaunchIntent)
                                }
                                
                                logView.append("✅ Eseguito a schermo!\n\n")
                            } else {
                                logView.append("⚠️ La TPU non ha generato un comando valido.\n\n")
                            }
                        } catch (e: Exception) { 
                            logView.append("❌ Errore TPU: ${e.message}\n\n")
                        } finally {
                            submitButton.isEnabled = true
                            inputField.text.clear()
                        }
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                scope.cancel()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-GeminiNano-Termux
        path: app/build/outputs/apk/debug/app-debug.apk
        
