name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 9
                versionName = "3.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            implementation("com.google.ai.edge.aicore:aicore:0.0.1-exp02")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <application android:label="Gemini Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.os.Bundle
        import android.widget.TextView
        import android.widget.ScrollView
        import kotlinx.coroutines.*
        
        class MainActivity : Activity() {
            private val scope = CoroutineScope(Dispatchers.Main + Job())
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                val textView = TextView(this).apply { 
                    text = "--- Agente Gemini Nano Inizializzato ---\n"
                    textSize = 15f
                    setPadding(32, 32, 32, 32) 
                }
                setContentView(ScrollView(this).apply { addView(textView) })
                
                scope.launch {
                    try {
                        textView.append("\nAggiramento del compilatore tramite Reflection in corso...\n")
                        
                        val responseText = withContext(Dispatchers.IO) {
                            try {
                                // Tentativo 1: API AiCoreClient Classica
                                val clientClass = Class.forName("com.google.android.apps.aicore.client.AiCoreClient")
                                val createMethod = clientClass.getMethod("create", android.content.Context::class.java)
                                val aiCoreClient = createMethod.invoke(null, applicationContext)
                                
                                val getModelMethod = clientClass.getMethod("getGenerativeModel", String::class.java)
                                val model = getModelMethod.invoke(aiCoreClient, "gemini-nano")
                                
                                val generateMethod = model.javaClass.getMethod("generateContent", String::class.java)
                                val response = generateMethod.invoke(model, "Sei un agente terminale. Rispondi solo ed esclusivamente con il comando Linux per vedere la cartella corrente.")
                                val textMethod = response.javaClass.getMethod("getText")
                                textMethod.invoke(response) as String
                            } catch (e: Exception) {
                                // Tentativo 2: Forzatura Builder GenerativeModel (Google AI Edge SDK)
                                val genConfigClass = Class.forName("com.google.ai.edge.aicore.GenerationConfig")
                                val genBuilder = genConfigClass.getMethod("builder").invoke(null)
                                val genConfig = genBuilder.javaClass.getMethod("build").invoke(genBuilder)
                                
                                val downConfigClass = Class.forName("com.google.ai.edge.aicore.DownloadConfig")
                                val downBuilder = downConfigClass.getMethod("builder").invoke(null)
                                val downConfig = downBuilder.javaClass.getMethod("build").invoke(downBuilder)
                                
                                val modelClass = Class.forName("com.google.ai.edge.aicore.GenerativeModel")
                                val modelConstructor = modelClass.getConstructor(genConfigClass, downConfigClass)
                                val model = modelConstructor.newInstance(genConfig, downConfig)
                                
                                val generateMethod = modelClass.getMethod("generateContent", String::class.java)
                                val response = generateMethod.invoke(model, "Sei un agente terminale. Rispondi solo ed esclusivamente con il comando Linux per vedere la cartella corrente.")
                                val textMethod = response.javaClass.getMethod("getText")
                                textMethod.invoke(response) as String
                            }
                        }
                        
                        textView.append("\n✅ Modello agganciato alla TPU!\n\n🤖 Comando generato: $responseText\n\n[Pronto per invio a Termux via Intent]")
                        
                    } catch (e: Exception) { 
                        textView.append("\nErrore runtime di sistema: ${e.message}\n")
                        try {
                             // Se fallisce, stampiamo a schermo i metodi esatti che la libreria contiene
                             val methods = Class.forName("com.google.ai.edge.aicore.GenerationConfig").declaredMethods.joinToString { it.name }
                             textView.append("\nDebug Strutturale: $methods")
                        } catch (ex: Exception) {}
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                scope.cancel()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-GeminiNano-TPU
        path: app/build/outputs/apk/debug/app-debug.apk
        
