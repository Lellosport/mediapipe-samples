name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 33
                versionName = "14.0-LiteRT"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            // Abbandoniamo ML Kit e passiamo a MediaPipe LiteRT!
            implementation("com.google.mediapipe:tasks-genai:0.10.14")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
                <package android:name="com.termux" />
            </queries>
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            
            <!-- Aggiunto android:largeHeap="true" per permettere il caricamento del modello in RAM -->
            <application 
                android:label="Gemini Agent Pro" 
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:largeHeap="true">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # FILE 1: Il Cervello (Ora usa MediaPipe LlmInference)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/GeminiAgentBrain.kt
        package com.agente.gemma
        
        import android.app.PendingIntent
        import android.content.Context
        import android.content.Intent
        import android.os.Build
        import kotlinx.coroutines.*
        import com.google.mediapipe.tasks.genai.llminference.LlmInference
        import java.io.File
        
        class GeminiAgentBrain(private val context: Context, private val logger: (String) -> Unit, private val onFinish: () -> Unit) {
            private val scope = CoroutineScope(Dispatchers.IO + Job())
            private var conversationHistory = ""
            private var stepCount = 0
            private var llmInference: LlmInference? = null
            
            private val systemPrompt = """
                Sei un Ingegnere Software Autonomo di altissimo livello.
                DEVI USARE OBBILGATORIAMENTE I DELIMITATORI. Non scrivere codice fuori da questi tag.
                
                REGOLE DI SVILUPPO:
                - Scrivi file completi, ricchi di dettagli, usa CSS elaborati e animazioni se scrivi HTML.
                
                Per agire su Linux usa:
                #INIZIO COMANDO#
                tuo_comando_qui
                #FINE COMANDO#
                
                Per concludere il lavoro usa:
                #INIZIO FINE#
                completato
                #FINE FINE#
                
                REGOLE MULTIMEDIALI:
                - Per spostare file usa mv o cp.
                - Per VISUALIZZARE immagini o RIPRODURRE audio usa: termux-open nomefile.ext
            """.trimIndent() + "\n\n"

            fun loadModel(modelPath: String, temperature: Float) {
                logger("⏳ Inizializzazione motore LiteRT in corso (Temp: $temperature)...\n")
                try {
                    val options = LlmInference.LlmInferenceOptions.builder()
                        .setModelPath(modelPath)
                        .setMaxTokens(2048)
                        .setTemperature(temperature)
                        .build()
                    
                    llmInference?.close() // Chiude il modello precedente se esiste
                    llmInference = LlmInference.createFromOptions(context, options)
                    logger("✅ Modello caricato nella NPU!\n\n")
                } catch (e: Exception) {
                    logger("❌ Errore caricamento modello: ${e.message}\n\n")
                }
            }

            fun startTask(objective: String) {
                if (llmInference == null) {
                    logger("⚠️ Devi prima inizializzare il modello!\n")
                    onFinish()
                    return
                }
                stepCount = 0
                conversationHistory = systemPrompt + "Obiettivo: $objective\n"
                logger("🎯 Avvio task autonomo...\n")
                thinkAndAct()
            }

            fun processTermuxResult(exitCode: Int, out: String, err: String) {
                stepCount++
                if (stepCount >= 7) {
                    logger("🛑 Limite azioni raggiunto. Forzo lo stop.\n\n")
                    onFinish()
                    return
                }
                
                val safeOut = if (out.length > 150) out.take(150) + "..." else out
                val safeErr = if (err.length > 150) err.take(150) + "..." else err
                
                val historyLines = conversationHistory.lines()
                if (historyLines.size > 20) {
                    conversationHistory = systemPrompt + historyLines.takeLast(8).joinToString("\n") + "\n"
                }
                
                conversationHistory += "Exit: $exitCode, Out: $safeOut, Err: $safeErr\nCosa fai ora?\n"
                thinkAndAct()
            }

            private fun thinkAndAct() {
                scope.launch {
                    try {
                        // Generazione tramite LiteRT!
                        val aiRawText = llmInference?.generateResponse(conversationHistory)?.trim() ?: ""
                        
                        var cmdToRun = ""
                        var finishMsg = ""
                        
                        if (aiRawText.contains("#INIZIO COMANDO#") && aiRawText.contains("#FINE COMANDO#")) {
                            cmdToRun = aiRawText.substringAfter("#INIZIO COMANDO#").substringBefore("#FINE COMANDO#").trim()
                        } else if (aiRawText.contains("#INIZIO FINE#") && aiRawText.contains("#FINE FINE#")) {
                            finishMsg = aiRawText.substringAfter("#INIZIO FINE#").substringBefore("#FINE FINE#").trim()
                        }
                        
                        withContext(Dispatchers.Main) {
                            if (cmdToRun.isNotBlank()) {
                                logger("🤖 Eseguo:\n$cmdToRun\n")
                                conversationHistory += "Hai inviato un comando.\n"
                                sendToTermux(cmdToRun)
                            } else if (finishMsg.isNotBlank()) {
                                logger("✅ Finito: $finishMsg\n\n")
                                onFinish()
                            } else {
                                logger("⚠️ Errore sintassi IA, riallineamento...\n")
                                conversationHistory += "ERRORE: Sintassi non trovata o vuota. Usa #INIZIO COMANDO# o #INIZIO FINE#.\n"
                                thinkAndAct()
                            }
                        }
                    } catch (e: Exception) {
                        withContext(Dispatchers.Main) {
                            logger("❌ Errore TPU: ${e.message}\n")
                            onFinish()
                        }
                    }
                }
            }

            private fun sendToTermux(cmd: String) {
                val resultIntent = Intent("com.agente.gemma.RESULT")
                resultIntent.setPackage(context.packageName)
                val pendingIntent = PendingIntent.getBroadcast(
                    context, 0, resultIntent, 
                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                )
                
                val intent = Intent("com.termux.RUN_COMMAND")
                intent.setClassName("com.termux", "com.termux.app.RunCommandService")
                intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/usr/bin/sh")
                intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS", arrayOf("-c", cmd))
                intent.putExtra("com.termux.RUN_COMMAND_WORKDIR", "/data/data/com.termux/files/home")
                intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true)
                intent.putExtra("com.termux.RUN_COMMAND_PENDING_INTENT", pendingIntent)
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    context.startForegroundService(intent)
                } else {
                    context.startService(intent)
                }
            }
        }
        EOF
        
        # FILE 2: La UI (Gestione doppio file: modello e prompt)
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.SeekBar
        import android.widget.TextView
        import kotlinx.coroutines.*
        import java.io.File
        
        class MainActivity : Activity() {
            private lateinit var logView: TextView
            private lateinit var submitButton: Button
            private lateinit var initModelButton: Button
            private lateinit var fileLabel: TextView
            private lateinit var agentBrain: GeminiAgentBrain
            
            private var fileContent: String = ""
            private var currentTemperature = 0.7f
            private var isModelLoaded = false
            
            private val PICK_MODEL_FILE = 1000
            private val PICK_TXT_FILE = 1001
            private val scope = CoroutineScope(Dispatchers.Main + Job())
            
            private val termuxReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context, intent: Intent) {
                    val bundle = intent.extras ?: return
                    val exitCode = bundle.getInt("com.termux.RUN_COMMAND_EXIT_CODE")
                    val out = bundle.getString("com.termux.RUN_COMMAND_STDOUT")?.trim() ?: ""
                    val err = bundle.getString("com.termux.RUN_COMMAND_STDERR")?.trim() ?: ""
                    
                    logView.append("   [Exit Code: $exitCode]\n")
                    agentBrain.processTermuxResult(exitCode, out, err)
                }
            }
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                
                agentBrain = GeminiAgentBrain(
                    context = this,
                    logger = { msg -> logView.append(msg) },
                    onFinish = { submitButton.isEnabled = true }
                )
                
                val filter = IntentFilter("com.agente.gemma.RESULT")
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    registerReceiver(termuxReceiver, filter, Context.RECEIVER_EXPORTED)
                } else {
                    registerReceiver(termuxReceiver, filter)
                }
                
                if (checkSelfPermission("com.termux.permission.RUN_COMMAND") != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf("com.termux.permission.RUN_COMMAND"), 1)
                }
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(48, 48, 48, 48)
                }
                
                val tempLabel = TextView(this).apply {
                    text = "Temperatura: 0.7\nScegli e clicca 'Inizializza' per applicarla."
                    setPadding(0, 0, 0, 10)
                }
                
                val tempSlider = SeekBar(this).apply {
                    max = 100
                    progress = 70
                    setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                        override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                            currentTemperature = progress / 100f
                            tempLabel.text = "Temperatura: $currentTemperature\nScegli e clicca 'Inizializza' per applicarla."
                        }
                        override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                        override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                    })
                }
                
                val loadModelButton = Button(this).apply {
                    text = "1. Importa Modello (.litertlm)"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "*/*"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        startActivityForResult(intent, PICK_MODEL_FILE)
                    }
                }
                
                initModelButton = Button(this).apply {
                    text = "2. Inizializza Motore IA"
                    isEnabled = false
                    setOnClickListener {
                        val modelFile = File(filesDir, "custom_model.litertlm")
                        if (modelFile.exists()) {
                            // Carica il modello in un thread asincrono per non bloccare la UI
                            scope.launch(Dispatchers.IO) {
                                agentBrain.loadModel(modelFile.absolutePath, currentTemperature)
                                isModelLoaded = true
                            }
                        }
                    }
                }
                
                fileLabel = TextView(this).apply {
                    text = "Prompt: Nessun file .txt selezionato"
                    setPadding(0, 20, 0, 20)
                }
                
                val selectPromptButton = Button(this).apply {
                    text = "3. Seleziona File Prompt (.txt)"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                            type = "text/plain"
                            addCategory(Intent.CATEGORY_OPENABLE)
                        }
                        startActivityForResult(intent, PICK_TXT_FILE)
                    }
                }
                
                submitButton = Button(this).apply {
                    text = "4. AVVIA AGENTE"
                    setOnClickListener {
                        if (!isModelLoaded) {
                            logView.append("⚠️ Devi prima inizializzare il modello!\n")
                            return@setOnClickListener
                        }
                        if (fileContent.isBlank()) {
                            logView.append("⚠️ Manca il prompt .txt!\n")
                            return@setOnClickListener
                        }
                        submitButton.isEnabled = false
                        logView.append("\n🎯 Esecuzione Prompt...\n")
                        agentBrain.startTask(fileContent)
                    }
                }
                
                logView = TextView(this).apply { 
                    text = "--- Agente LiteRT con Modello Custom ---\n"
                    textSize = 15f
                }
                
                layout.addView(tempLabel)
                layout.addView(tempSlider)
                layout.addView(loadModelButton)
                layout.addView(initModelButton)
                layout.addView(selectPromptButton)
                layout.addView(fileLabel)
                layout.addView(submitButton)
                layout.addView(logView)
                
                setContentView(ScrollView(this).apply { addView(layout) })
                
                // Controlla se il modello è già stato importato in sessioni precedenti
                if (File(filesDir, "custom_model.litertlm").exists()) {
                    initModelButton.isEnabled = true
                    logView.append("✅ Trovato modello importato in memoria.\n")
                }
            }
            
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (resultCode == RESULT_OK && data?.data != null) {
                    val uri = data.data!!
                    if (requestCode == PICK_MODEL_FILE) {
                        logView.append("⏳ Copia del modello in corso (può volerci qualche istante)...\n")
                        scope.launch(Dispatchers.IO) {
                            try {
                                val outFile = File(filesDir, "custom_model.litertlm")
                                contentResolver.openInputStream(uri)?.use { input ->
                                    outFile.outputStream().use { output ->
                                        input.copyTo(output)
                                    }
                                }
                                withContext(Dispatchers.Main) {
                                    logView.append("✅ Modello copiato con successo!\n")
                                    initModelButton.isEnabled = true
                                }
                            } catch (e: Exception) {
                                withContext(Dispatchers.Main) {
                                    logView.append("❌ Errore copia modello: ${e.message}\n")
                                }
                            }
                        }
                    } else if (requestCode == PICK_TXT_FILE) {
                        try {
                            val content = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() }
                            if (!content.isNullOrBlank()) {
                                fileContent = content
                                fileLabel.text = "✅ Prompt caricato!"
                            }
                        } catch (e: Exception) {
                            fileLabel.text = "❌ Errore lettura prompt"
                        }
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                unregisterReceiver(termuxReceiver)
                scope.cancel()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-LiteRT-Termux
        path: app/build/outputs/apk/debug/app-debug.apk
                            
