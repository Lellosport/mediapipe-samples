name: Compila Agente Minimal

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App da zero
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GemmaAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "1.9.22" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { implementation("com.google.mediapipe:tasks-genai:0.10.14") }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <application android:label="Gemma Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.os.Bundle
        import android.widget.TextView
        import android.widget.ScrollView
        import com.google.mediapipe.tasks.genai.llminference.LlmInference
        import java.io.File
        
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                val textView = TextView(this).apply { 
                    text = "--- Agente Gemma Inizializzato ---\n"
                    textSize = 16f
                    setPadding(32, 32, 32, 32) 
                }
                setContentView(ScrollView(this).apply { addView(textView) })
                
                Thread {
                    try {
                        val modelFile = File(getExternalFilesDir(null), "gemma.task")
                        if (!modelFile.exists()) { 
                            runOnUiThread { textView.append("\n❌ ERRORE: Modello mancante.\nSposta il file gemma.task in questo percorso esatto:\n${modelFile.absolutePath}\n\nUsa il gestore file di Android per spostarlo.") }
                            return@Thread 
                        }
                        
                        runOnUiThread { textView.append("\n✅ Modello trovato! Caricamento in TPU/NPU in corso...\n") }
                        
                        val options = LlmInference.LlmInferenceOptions.builder()
                            .setModelPath(modelFile.absolutePath)
                            .setMaxTokens(50)
                            .build()
                            
                        val llm = LlmInference.createFromOptions(this, options)
                        runOnUiThread { textView.append("✅ Motore MediaPipe caricato!\n\nGenerazione...\n") }
                        
                        val prompt = "Sei un agente terminale. Qual è il comando Linux per vedere in quale cartella mi trovo? Rispondi solo con il comando."
                        val response = llm.generateResponse(prompt)
                        
                        runOnUiThread { textView.append("\n🤖 Risposta di Gemma: $response\n\n[Pronto per collegarsi a Termux]") }
                    } catch (e: Exception) { 
                        runOnUiThread { textView.append("\nErrore di elaborazione: ${e.message}\n") } 
                    }
                }.start()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-Gemma-Minimal
        path: app/build/outputs/apk/debug/app-debug.apk
        
