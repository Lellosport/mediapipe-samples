name: Compila App Upscale Settori

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura del progetto
      run: |
        mkdir -p app/src/main/java/com/app/upscale
        mkdir -p app/src/main/assets
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "SectorUpscale"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.app.upscale"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.app.upscale"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            aaptOptions {
                noCompress("tflite")
            }
        }
        dependencies { 
            implementation("org.tensorflow:tensorflow-lite:2.14.0")
            implementation("org.tensorflow:tensorflow-lite-support:0.4.4")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
            
            <application 
                android:label="Sector Upscale" 
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:largeHeap="true">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/app/upscale/MainActivity.kt
        package com.app.upscale
        
        import android.app.Activity
        import android.content.ContentValues
        import android.content.Intent
        import android.graphics.Bitmap
        import android.graphics.BitmapFactory
        import android.graphics.Canvas
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Environment
        import android.provider.MediaStore
        import android.view.WindowManager
        import android.widget.*
        import kotlinx.coroutines.*
        import org.tensorflow.lite.Interpreter
        import org.tensorflow.lite.nnapi.NnApiDelegate
        import java.io.File
        import java.nio.ByteBuffer
        import java.nio.ByteOrder
        
        class MainActivity : Activity() {
            private lateinit var statusText: TextView
            private lateinit var startButton: Button
            private lateinit var saveButton: Button
            private lateinit var seekBar: SeekBar
            private lateinit var sectorLabel: TextView
            
            private var selectedImageUri: Uri? = null
            private var processedBitmap: Bitmap? = null
            private var gridSectors = 2
            
            private val PICK_IMAGE = 100
            private val scope = CoroutineScope(Dispatchers.Main + Job())
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(40, 40, 40, 40)
                }
                
                val title = TextView(this).apply { text = "Upscaler a Settori (NPU)\n"; textSize = 20f }
                
                sectorLabel = TextView(this).apply { text = "Divisione griglia: ${gridSectors}x${gridSectors} settori" }
                seekBar = SeekBar(this).apply {
                    max = 6; progress = 1
                    setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                        override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) {
                            gridSectors = p + 1
                            sectorLabel.text = "Divisione griglia: ${gridSectors}x${gridSectors} settori"
                        }
                        override fun onStartTrackingTouch(s: SeekBar?) {}
                        override fun onStopTrackingTouch(s: SeekBar?) {}
                    })
                }
                
                val selectButton = Button(this).apply {
                    text = "1. Seleziona Immagine"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_GET_CONTENT).apply { type = "image/*" }
                        startActivityForResult(intent, PICK_IMAGE)
                    }
                }
                
                startButton = Button(this).apply {
                    text = "2. Avvia Upscaling a Settori"
                    isEnabled = false
                    setOnClickListener {
                        selectedImageUri?.let { uri -> startUpscaling(uri) }
                    }
                }
                
                saveButton = Button(this).apply {
                    text = "3. Salva Risultato"
                    isEnabled = false
                    setOnClickListener {
                        processedBitmap?.let { bmp -> saveImageToGallery(bmp) }
                    }
                }
                
                statusText = TextView(this).apply { text = "\nPronto.\n"; textSize = 14f }
                
                layout.addView(title)
                layout.addView(sectorLabel)
                layout.addView(seekBar)
                layout.addView(selectButton)
                layout.addView(startButton)
                layout.addView(saveButton)
                layout.addView(statusText)
                
                setContentView(ScrollView(this).apply { addView(layout) })
            }
            
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (resultCode == RESULT_OK && requestCode == PICK_IMAGE && data?.data != null) {
                    selectedImageUri = data.data
                    statusText.append("✅ Immagine selezionata.\n")
                    startButton.isEnabled = true
                }
            }
            
            private fun startUpscaling(uri: Uri) {
                startButton.isEnabled = false
                saveButton.isEnabled = false
                
                scope.launch(Dispatchers.IO) {
                    try {
                        statusText.append("⏳ Caricamento immagine...\n")
                        val inputStream = contentResolver.openInputStream(uri)
                        val originalBitmap = BitmapFactory.decodeStream(inputStream)
                        inputStream?.close()
                        
                        val origW = originalBitmap.width
                        val origH = originalBitmap.height
                        
                        // Inizializza l'interprete TFLite con NNAPI Delegate forzato sulla NPU
                        val modelFile = loadModelFileFromAssets("model_sr.tflite")
                        val options = Interpreter.Options().apply {
                            val nnApiDelegate = NnApiDelegate()
                            addDelegate(nnApiDelegate)
                            setUseNnapiCpu(false)
                        }
                        
                        val interpreter = Interpreter(modelFile, options)
                        statusText.append("🚀 NPU (NNAPI) inizializzata con successo!\n")
                        
                        // Esempio fattore di scala 2x
                        val scaleFactor = 2
                        val finalW = origW * scaleFactor
                        val finalH = origH * scaleFactor
                        val resultBitmap = Bitmap.createBitmap(finalW, finalH, Bitmap.Config.ARGB_8888)
                        val canvas = Canvas(resultBitmap)
                        
                        val sectorW = origW / gridSectors
                        val sectorH = origH / gridSectors
                        
                        var currentSector = 1
                        val totalSectors = gridSectors * gridSectors
                        
                        for (y in 0 until gridSectors) {
                            for (x in 0 until gridSectors) {
                                statusText.append("⚙️ Elaborazione settore $currentSector / $totalSectors...\n")
                                
                                val startX = x * sectorW
                                val startY = y * sectorH
                                val w = if (x == gridSectors - 1) origW - startX else sectorW
                                val h = if (y == gridSectors - 1) origH - startY else sectorH
                                
                                // Taglio del settore dalla bitmap originale
                                val sectorBitmap = Bitmap.createBitmap(originalBitmap, startX, startY, w, h)
                                
                                // Esegue l'upscale del singolo settore tramite il modello TFLite
                                val upscaledSector = upscaleSectorWithTflite(interpreter, sectorBitmap, scaleFactor)
                                
                                // Ricostruzione geometrica sul canvas finale
                                canvas.drawBitmap(upscaledSector, (startX * scaleFactor).toFloat(), (startY * scaleFactor).toFloat(), null)
                                currentSector++
                            }
                        }
                        
                        interpreter.close()
                        processedBitmap = resultBitmap
                        
                        withContext(Dispatchers.Main) {
                            statusText.append("✨ Upscaling completato con successo!\n")
                            saveButton.isEnabled = true
                            startButton.isEnabled = true
                        }
                        
                    } catch (e: Exception) {
                        withContext(Dispatchers.Main) {
                            statusText.append("❌ Errore: ${e.message}\n")
                            startButton.isEnabled = true
                        }
                    }
                }
            }
            
            private fun loadModelFileFromAssets(fileName: String): ByteBuffer {
                val assetManager = assets
                val descriptor = assetManager.openFd(fileName)
                val inputStream = descriptor.createInputStream()
                val buffer = ByteBuffer.allocateDirect(descriptor.declaredLength.toInt())
                buffer.order(ByteOrder.nativeOrder())
                inputStream.channel.read(buffer)
                inputStream.close()
                return buffer
            }
            
            private fun upscaleSectorWithTflite(interpreter: Interpreter, inputBmp: Bitmap, scale: Int): Bitmap {
                val w = inputBmp.width
                val h = inputBmp.height
                val outW = w * scale
                val outH = h * scale
                
                val inputBuffer = ByteBuffer.allocateDirect(4 * w * h * 3).order(ByteOrder.nativeOrder())
                for (y in 0 until h) {
                    for (x in 0 until w) {
                        val pixel = inputBmp.getPixel(x, y)
                        inputBuffer.putFloat(((pixel shr 16) and 0xFF) / 255.0f)
                        inputBuffer.putFloat(((pixel shr 8) and 0xFF) / 255.0f)
                        inputBuffer.putFloat((pixel and 0xFF) / 255.0f)
                    }
                }
                
                val outputBuffer = ByteBuffer.allocateDirect(4 * outW * outH * 3).order(ByteOrder.nativeOrder())
                interpreter.run(inputBuffer, outputBuffer)
                outputBuffer.rewind()
                
                val outputBmp = Bitmap.createBitmap(outW, outH, Bitmap.Config.ARGB_8888)
                for (y in 0 until outH) {
                    for (x in 0 until outW) {
                        val r = (outputBuffer.float * 255.0f).coerceIn(0f, 255f).toInt()
                        val g = (outputBuffer.float * 255.0f).coerceIn(0f, 255f).toInt()
                        val b = (outputBuffer.float * 255.0f).coerceIn(0f, 255f).toInt()
                        outputBmp.setPixel(x, y, android.graphics.Color.rgb(r, g, b))
                    }
                }
                return outputBmp
            }
            
            private fun saveImageToGallery(bitmap: Bitmap) {
                val filename = "Upscaled_${System.currentTimeMillis()}.png"
                val fos = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    val resolver = contentResolver
                    val contentValues = ContentValues().apply {
                        put(MediaStore.MediaColumns.DISPLAY_NAME, filename)
                        put(MediaStore.MediaColumns.MIME_TYPE, "image/png")
                        put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES)
                    }
                    val imageUri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, contentValues)
                    imageUri?.let { resolver.openOutputStream(it) }
                } else {
                    val imagesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES)
                    val image = File(imagesDir, filename)
                    image.outputStream()
                }
                
                fos?.use {
                    bitmap.compress(Bitmap.CompressFormat.PNG, 100, it)
                    statusText.append("💾 Immagine salvata in Galleria!\n")
                }
            }
        }
        EOF
    
    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Sector-Upscale-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
