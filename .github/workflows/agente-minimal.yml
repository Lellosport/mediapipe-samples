name: Compila Agente Gemini Nano

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Inizializza spazio di lavoro
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crea la struttura nativa dell'App
      run: |
        mkdir -p app/src/main/java/com/agente/gemma
        
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "GeminiAgent"
        include(":app")
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { 
            id("com.android.application") version "8.2.2"
            id("org.jetbrains.kotlin.android") version "2.1.0" 
        }
        android {
            namespace = "com.agente.gemma"
            compileSdk = 34
            defaultConfig { 
                applicationId = "com.agente.gemma"
                minSdk = 31
                targetSdk = 34
                versionCode = 28
                versionName = "10.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }
        dependencies { 
            implementation("com.google.mlkit:genai-prompt:1.0.0-beta2")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("androidx.core:core-ktx:1.12.0")
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
                <package android:name="com.termux" />
            </queries>
            <uses-permission android:name="com.termux.permission.RUN_COMMAND" />
            <application android:label="Gemini Agent" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/agente/gemma/MainActivity.kt
        package com.agente.gemma
        
        import android.app.Activity
        import android.app.PendingIntent
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.os.Build
        import android.os.Bundle
        import android.view.WindowManager
        import android.widget.Button
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.TextView
        import kotlinx.coroutines.*
        import com.google.mlkit.genai.prompt.Generation
        
        class MainActivity : Activity() {
            private val scope = CoroutineScope(Dispatchers.Main + Job())
            private lateinit var logView: TextView
            private lateinit var submitButton: Button
            
            private var conversationHistory = ""
            private var stepCount = 0
            
            private val systemPrompt = """
                Sei un Ingegnere Software Autonomo. Hai accesso a un terminale Linux.
                Devi completare l'obiettivo verificando costantemente il tuo lavoro.
                
                REGOLE DI COMUNICAZIONE (OBBLIGATORIE):
                Per eseguire un comando DEVI usare questi esatti delimitatori. Tutto ciò che è all'interno verrà eseguito dal terminale:
                #INIZIO COMANDO#
                tuo_comando_qui
                #FINE COMANDO#
                
                Per dichiarare il task concluso, usa:
                #INIZIO FINE#
                Il tuo messaggio per l'utente
                #FINE FINE#
                
                REGOLE DI SVILUPPO (ARTEFATTI):
                1. Se devi creare o modificare script complessi, fai tutto in un unico comando combinato o usa heredoc (cat << 'EOF' > file.txt).
                2. Non verificare lo stesso file all'infinito.
            """.trimIndent() + "\n\n"
        
            private val termuxReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context, intent: Intent) {
                    val bundle = intent.extras ?: return
                    val exitCode = bundle.getInt("com.termux.RUN_COMMAND_EXIT_CODE")
                    var out = bundle.getString("com.termux.RUN_COMMAND_STDOUT")?.trim() ?: ""
                    var err = bundle.getString("com.termux.RUN_COMMAND_STDERR")?.trim() ?: ""
                    
                    if (out.length > 150) out = out.take(150) + "..."
                    if (err.length > 150) err = err.take(150) + "..."
                    
                    logView.append("   [Exit Code: $exitCode]\n")
                    
                    stepCount++
                    if (stepCount >= 7) {
                        logView.append("🛑 Raggiunto limite azioni per questo task.\n\n")
                        submitButton.isEnabled = true
                        return
                    }
                    
                    val historyLines = conversationHistory.lines()
                    if (historyLines.size > 20) {
                        conversationHistory = systemPrompt + historyLines.takeLast(8).joinToString("\n") + "\n"
                    }
                    
                    val contextHint = if (exitCode == 0) {
                        "SUCCESSO. Se hai fatto tutto, usa #INIZIO FINE#."
                    } else {
                        "ERRORE. Correggi e usa di nuovo #INIZIO COMANDO#."
                    }
                    
                    conversationHistory += "Termux ha risposto:\nExit: $exitCode\nOut: $out\nErr: $err\n$contextHint\n"
                    executeAgentLoop()
                }
            }
        
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                
                val filter = IntentFilter("com.agente.gemma.RESULT")
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    registerReceiver(termuxReceiver, filter, Context.RECEIVER_EXPORTED)
                } else {
                    registerReceiver(termuxReceiver, filter)
                }
                
                if (checkSelfPermission("com.termux.permission.RUN_COMMAND") != PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(arrayOf("com.termux.permission.RUN_COMMAND"), 1)
                }
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(48, 48, 48, 48)
                }
                
                logView = TextView(this).apply { 
                    text = "--- Agente Gemini Nano v6 (Syntax) ---\n\n"
                    textSize = 15f
                }
                
                val inputField = EditText(this).apply {
                    hint = "Es: Crea uno script python che stampa 'Ciao' e avvialo"
                    textSize = 16f
                }
                
                submitButton = Button(this).apply {
                    text = "Assegna Obiettivo"
                }
                
                layout.addView(inputField)
                layout.addView(submitButton)
                layout.addView(logView)
                
                setContentView(ScrollView(this).apply { addView(layout) })
                
                submitButton.setOnClickListener {
                    val userRequest = inputField.text.toString()
                    if (userRequest.isBlank()) return@setOnClickListener
                    
                    submitButton.isEnabled = false
                    stepCount = 0
                    
                    logView.append("\n🎯 OBIETTIVO: $userRequest\n")
                    
                    conversationHistory = systemPrompt + "Obiettivo: $userRequest\nInizia:\n"
                    executeAgentLoop()
                }
            }
            
            private fun executeAgentLoop() {
                scope.launch {
                    try {
                        val model = Generation.getClient()
                        val response = withContext(Dispatchers.IO) {
                            model.generateContent(conversationHistory)
                        }
                        
                        val aiRawText = response.candidates.firstOrNull()?.text?.trim() ?: ""
                        
                        // Parser robusto con la nuova sintassi
                        var cmdToRun = ""
                        var finishMsg = ""
                        
                        if (aiRawText.contains("#INIZIO COMANDO#") && aiRawText.contains("#FINE COMANDO#")) {
                            cmdToRun = aiRawText.substringAfter("#INIZIO COMANDO#").substringBefore("#FINE COMANDO#").trim()
                        } else if (aiRawText.contains("#INIZIO FINE#") && aiRawText.contains("#FINE FINE#")) {
                            finishMsg = aiRawText.substringAfter("#INIZIO FINE#").substringBefore("#FINE FINE#").trim()
                        }
                        
                        if (cmdToRun.isNotEmpty()) {
                            logView.append("🤖 Lancia:\n$cmdToRun\n")
                            conversationHistory += "Hai usato:\n#INIZIO COMANDO#\n$cmdToRun\n#FINE COMANDO#\n"
                            
                            val resultIntent = Intent("com.agente.gemma.RESULT")
                            resultIntent.setPackage(packageName)
                            val pendingIntent = PendingIntent.getBroadcast(
                                this@MainActivity, 0, resultIntent, 
                                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                            )
                            
                            val intent = Intent("com.termux.RUN_COMMAND")
                            intent.setClassName("com.termux", "com.termux.app.RunCommandService")
                            intent.putExtra("com.termux.RUN_COMMAND_PATH", "/data/data/com.termux/files/usr/bin/sh")
                            intent.putExtra("com.termux.RUN_COMMAND_ARGUMENTS", arrayOf("-c", cmdToRun))
                            intent.putExtra("com.termux.RUN_COMMAND_WORKDIR", "/data/data/com.termux/files/home")
                            intent.putExtra("com.termux.RUN_COMMAND_BACKGROUND", true)
                            intent.putExtra("com.termux.RUN_COMMAND_PENDING_INTENT", pendingIntent)
                            
                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                startForegroundService(intent)
                            } else {
                                startService(intent)
                            }
                            
                        } else if (finishMsg.isNotEmpty()) {
                            logView.append("✅ Finito: $finishMsg\n\n")
                            submitButton.isEnabled = true
                        } else {
                            logView.append("⚠️ Sintassi mancante, richiedo formattazione...\n")
                            conversationHistory += "Usa OBBILGATORIAMENTE i delimitatori #INIZIO COMANDO# e #FINE COMANDO#.\n"
                            executeAgentLoop()
                        }
                    } catch (e: Exception) { 
                        logView.append("❌ Errore TPU: ${e.message}\n")
                        submitButton.isEnabled = true
                    }
                }
            }
            
            override fun onDestroy() {
                super.onDestroy()
                unregisterReceiver(termuxReceiver)
                scope.cancel()
            }
        }
        EOF

    - name: Configura ambiente Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Compila App da zero
      run: gradle assembleDebug

    - name: Salva l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Agente-GeminiNano-Termux
        path: app/build/outputs/apk/debug/app-debug.apk
        
