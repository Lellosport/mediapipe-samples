name: Compila App Gemma TPU

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Configura Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dai i permessi a Gradle
      run: chmod +x examples/llm_inference/android/gradlew

    - name: Compila l'APK
      run: |
        cd examples/llm_inference/android
        ./gradlew assembleDebug

    - name: Salva l'APK da scaricare
      uses: actions/upload-artifact@v4
      with:
        name: Gemma-TPU-App
        path: examples/llm_inference/android/app/build/outputs/apk/debug/app-debug.apk
        
